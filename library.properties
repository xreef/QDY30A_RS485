sentence=Library for fluid level measurement using the QDY30A RS485 level transmitter with Modbus RTU protocol. Compatible with Arduino, STM32, ESP8266, ESP32, and Raspberry Pi Pico.
paragraph=QDY30A_RS485 is designed to simplify the integration and communication with the QDY30A level transmitter over RS485 using the Modbus RTU protocol. It supports a wide range of microcontrollers including Arduino, STM32, ESP8266, ESP32, and Raspberry Pi Pico, making it versatile for various fluid level measurement projects.
